[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-vpn-local"
version = "0.1.0"
description = "Aplicacao local para backtest preliminar de VPN em DB2"
requires-python = ">=3.9"
dependencies = [
  "ibm-db>=3.2.0",
]

[project.scripts]
backtest-vpn = "backtest_vpn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
